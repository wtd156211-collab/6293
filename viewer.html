  .ok { color: #0a7d2c; } .bad { color: #c00; }

<body>
<h1>扫描线填充核对视图</h1>
<div class="bar">

</div>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="legend">

  <span class="swatch" style="border:2px solid #d63384"></span>轮廓（画布内实线）
  <span class="swatch" style="border:2px dashed #d63384"></span>轮廓被裁掉的部分（虚线）
</div>
<script>
"use strict";
const SAMPLES = {"01-concave":{"rows":[[2,[[2,13]]],[3,[[2,13],[16,21]]],[4,[[2,13],[16,21]]],[5,[[2,13],[16,21]]],[6,[[2,6],[16,21]]],[7,[[2,6],[16,17],[19,21]]],[8,[[2,6],[16,17],[19,21]]],[9,[[2,6],[16,17],[19,21]]],[10,[[2,6],[16,17],[19,21]]],[11,[[2,6],[16,17],[19,21]]],[12,[[2,6]]]],"canvas":[24,16],"rule":"even-odd","filled":132,"hash":"0xd9b82cc163670028","contours":[[[2,2],[14,2],[14,6],[7,6],[7,13],[2,13]],[[16,3],[22,3],[22,12],[19,12],[19,7],[18,7],[18,12],[16,12]]],"elapsed_ms":14.4},"02-ring-holes":{"rows":[[1,[[1,25]]],[2,[[1,25]]],[3,[[1,25]]],[4,[[1,4],[12,25]]],[5,[[1,4],[12,25]]],[6,[[1,4],[12,15],[24,25]]],[7,[[1,4],[12,16],[24,25]]],[8,[[1,4],[12,16],[24,25]]],[9,[[1,17],[23,25]]],[10,[[1,17],[23,25]]],[11,[[1,18],[22,25]]],[12,[[1,18],[22,25]]],[13,[[1,19],[21,25]]],[14,[[1,19],[21,25]]],[15,[[1,25]]],[16,[[1,25]]],[17,[[1,25]]]],"canvas":[28,20],"rule":"even-odd","filled":350,"hash":"0x95a760f9585aba16","contours":[[[1,1],[26,1],[26,18],[1,18]],[[5,4],[12,4],[12,9],[5,9]],[[16,6],[24,6],[20,15]]],"elapsed_ms":13.3},"03-pentagram-evenodd":{"rows":[[3,[[12,12]]],[4,[[12,12]]],[5,[[11,12]]],[6,[[11,13]]],[7,[[11,13]]],[8,[[10,13]]],[9,[[2,9],[15,21]]],[10,[[4,9],[15,20]]],[11,[[5,8],[15,19]]],[12,[[7,8],[16,17]]],[13,[[8,8],[16,16]]],[14,[[8,9],[15,15]]],[15,[[8,10],[14,16]]],[16,[[8,11],[13,16]]],[17,[[7,10],[14,16]]],[18,[[7,8],[16,17]]],[19,[[7,7],[17,17]]]],"canvas":[26,24],"rule":"even-odd","filled":86,"hash":"0xbb465649725dcd91","contours":[[[12,2],[18,20],[2,9],[22,9],[6,20]]],"elapsed_ms":13.4},"04-pentagram-nonzero":{"rows":[[3,[[12,12]]],[4,[[12,12]]],[5,[[11,12]]],[6,[[11,13]]],[7,[[11,13]]],[8,[[10,13]]],[9,[[2,21]]],[10,[[4,20]]],[11,[[5,19]]],[12,[[7,17]]],[13,[[8,16]]],[14,[[8,15]]],[15,[[8,16]]],[16,[[8,11],[13,16]]],[17,[[7,10],[14,16]]],[18,[[7,8],[16,17]]],[19,[[7,7],[17,17]]]],"canvas":[26,24],"rule":"nonzero","filled":124,"hash":"0x2a8d71f58cd24f5b","contours":[[[12,2],[18,20],[2,9],[22,9],[6,20]]],"elapsed_ms":12.2},"05-scanline-vertices":{"rows":[[2,[[2,15]]],[3,[[2,15]]],[4,[[2,3],[7,9],[13,15]]],[5,[[2,3],[7,9],[13,15],[20,27]]],[6,[[2,3],[7,9],[13,15],[21,27]]],[7,[[2,3],[7,9],[13,15],[21,26]]],[8,[[2,3],[7,9],[13,15],[22,26]]],[9,[[2,3],[7,9],[13,15],[22,25]]],[10,[[2,3],[7,9],[13,15],[23,25]]],[11,[[2,3],[7,9],[13,15],[23,24]]],[12,[[2,3],[7,9],[13,15],[24,24]]],[13,[[2,3],[7,9],[13,15],[23,24]]],[14,[[2,3],[7,9],[13,15],[22,25]]],[15,[[21,21],[26,26]]]],"canvas":[30,18],"rule":"even-odd","filled":160,"hash":"0x8165e329220534a6","contours":[[[2,2],[16,2],[16,15],[13,15],[13,4],[10,4],[10,15],[7,15],[7,4],[4,4],[4,15],[2,15]],[[20,5],[28,5],[24,13]],[[20,16],[24,12],[28,16],[24,14]]],"elapsed_ms":12.4},"06-horizontal-edges":{"rows":[[2,[[3,23]]],[7,[[3,18]]],[8,[[3,18]]],[9,[[3,18]]],[10,[[3,18]]],[11,[[3,18]]],[14,[[3,20]]],[15,[[7,20]]],[16,[[13,20]]]],"canvas":[28,18],"rule":"even-odd","filled":141,"hash":"0xe2c8d59e9866a859","contours":[[[3,2],[14,2],[14,2],[24,2],[24,3],[3,3]],[[3,7],[11,7],[11,12],[3,12]],[[11,7],[19,7],[19,12],[11,12]],[[3,14],[21,14],[21,17],[13,17],[13,16],[7,16],[7,15],[3,15]]],"elapsed_ms":12.6},"07-thin-sliver":{"rows":[[1,[[2,2]]],[2,[[3,3],[26,26]]],[3,[[4,4],[17,17],[26,26]]],[4,[[4,4],[17,17],[26,26]]],[5,[[5,5],[17,17],[26,26]]],[6,[[5,5],[17,17],[26,26]]],[7,[[6,6],[17,17],[26,26]]],[8,[[7,7],[17,17],[26,26]]],[9,[[7,7],[17,17],[26,26]]],[10,[[8,8],[17,17],[26,26]]],[11,[[8,8],[17,17],[26,26]]],[12,[[9,9],[17,17],[26,26]]],[13,[[10,10],[17,17],[26,26]]],[14,[[10,10],[17,17],[26,26]]],[15,[[11,11],[17,17],[26,26]]],[16,[[11,11],[17,17],[26,26]]],[17,[[12,12],[17,17],[26,26]]],[18,[[26,26]]]],"canvas":[30,20],"rule":"even-odd","filled":49,"hash":"0x3bc8d05ce445cbe4","contours":[[[2,1],[3,1],[13,18],[12,18]],[[17,3],[18,3],[17,18]],[[26,2],[27,2],[27,19],[26,19]]],"elapsed_ms":12.6},"08-clipped-canvas":{"rows":[[0,[[0,8]]],[1,[[0,8]]],[2,[[0,8],[12,23]]],[3,[[0,8],[12,23]]],[4,[[0,8],[12,23]]],[5,[[0,8],[12,23]]],[6,[[0,8],[12,17]]],[7,[[0,8],[12,17]]],[8,[[12,17]]],[9,[[12,17]]],[10,[[12,23]]],[11,[[0,4],[12,23]]],[12,[[0,4],[12,23]]],[13,[[0,4],[12,23]]]],"canvas":[24,14],"rule":"even-odd","filled":207,"hash":"0xe6fc86f6c133c619","contours":[[[-5,-3],[9,-3],[9,8],[-5,8]],[[30,-6],[40,-6],[40,2],[30,2]],[[12,2],[30,2],[30,16],[12,16]],[[18,6],[34,6],[34,10],[18,10]],[[-3,11],[5,11],[1,20]]],"elapsed_ms":11.9},"09-nested-nonzero":{"rows":[[2,[[2,10],[15,23]]],[3,[[2,10],[15,23]]],[4,[[2,10],[15,17],[21,23]]],[5,[[2,10],[15,17],[21,23]]],[6,[[2,10],[15,17],[21,23]]],[7,[[2,10],[15,23]]],[8,[[2,10],[15,23]]]],"canvas":[26,12],"rule":"nonzero","filled":117,"hash":"0x84fec4b40e661d2e","contours":[[[2,2],[11,2],[11,9],[2,9]],[[5,4],[8,4],[8,7],[5,7]],[[15,2],[24,2],[24,9],[15,9]],[[18,4],[18,7],[21,7],[21,4]]],"elapsed_ms":13.2}};
const CELL = 28;          // 1 个数学单位对应的屏幕像素
const MARGIN = 1;         // 视图外留白（单位：数学坐标）

function clipEdgeToCanvas(x1, y1, x2, y2, w, h) {
  // Cohen–Sutherland，裁到 [-0.5, w-0.5] x [-0.5, h-0.5]
  const xmin = -0.5, xmax = w - 0.5, ymin = -0.5, ymax = h - 0.5;
  const L = 1, R = 2, B = 4, T = 8;
  const code = (x, y) =>
    (x < xmin ? L : 0) | (x > xmax ? R : 0) | (y < ymin ? T : 0) | (y > ymax ? B : 0);
  let c1 = code(x1, y1), c2 = code(x2, y2);
  for (;;) {
    if (!(c1 | c2)) return [x1, y1, x2, y2];
    if (c1 & c2) return null;
    const c = c1 || c2;
    let x, y;
    if (c & T) { x = x1 + (x2 - x1) * (ymin - y1) / (y2 - y1); y = ymin; }
    else if (c & B) { x = x1 + (x2 - x1) * (ymax - y1) / (y2 - y1); y = ymax; }
    else if (c & R) { y = y1 + (y2 - y1) * (xmax - x1) / (x2 - x1); x = xmax; }
    else { y = y1 + (y2 - y1) * (xmin - x1) / (x2 - x1); x = xmin; }
    if (c === c1) { x1 = x; y1 = y; c1 = code(x1, y1); }
    else { x2 = x; y2 = y; c2 = code(x2, y2); }
  }
}

function el(name, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

function render(name) {
  const s = SAMPLES[name];
  const [W, H] = s.canvas;
  const svg = document.getElementById("stage");
  svg.textContent = "";

  // 视图范围：画布与全部轮廓的并集，外扩 MARGIN
  let vx0 = -0.5, vy0 = -0.5, vx1 = W - 0.5, vy1 = H - 0.5;
  for (const contour of s.contours)
    for (const [x, y] of contour) {
      vx0 = Math.min(vx0, x); vy0 = Math.min(vy0, y);
      vx1 = Math.max(vx1, x); vy1 = Math.max(vy1, y);
    }
  vx0 -= MARGIN; vy0 -= MARGIN; vx1 += MARGIN; vy1 += MARGIN;
  svg.setAttribute("viewBox", [vx0, vy0, vx1 - vx0, vy1 - vy0].join(" "));
  svg.setAttribute("width", Math.round((vx1 - vx0) * CELL));
  svg.setAttribute("height", Math.round((vy1 - vy0) * CELL));

  // 1. 填充像素（只画引擎结果）
  const fillLayer = el("g", { fill: "#9ec5fe" });
  let rendered = 0;
  for (const [y, spans] of s.rows)
    for (const [a, b] of spans)
      for (let i = a; i <= b; i++) {
        const r = el("rect", {
          x: i - 0.5, y: y - 0.5, width: 1, height: 1,
          "data-pixel": i + "," + y,
        });
        fillLayer.appendChild(r);
        rendered++;
      }
  svg.appendChild(fillLayer);

  // 2. 画布边界
  svg.appendChild(el("rect", {
    x: -0.5, y: -0.5, width: W, height: H,
    fill: "none", stroke: "#333", "stroke-width": 0.06,
  }));

  // 3. 轮廓：整体 <polygon> 虚线（被裁掉的部分即画布外的虚线段），
  //    画布内部分再用实线 <path> 压一遍
  const dashedLayer = el("g", {
    fill: "none", stroke: "#d63384", "stroke-width": 0.08,
    "stroke-dasharray": "0.3 0.18", opacity: 0.9,
  });
  const solidSegs = [];
  for (const contour of s.contours) {
    dashedLayer.appendChild(el("polygon", {
      points: contour.map(p => p.join(",")).join(" "),
    }));
    for (let k = 0; k < contour.length; k++) {
      const [x1, y1] = contour[k];
      const [x2, y2] = contour[(k + 1) % contour.length];
      const seg = clipEdgeToCanvas(x1, y1, x2, y2, W, H);
      if (seg) solidSegs.push(seg);
    }
  }
  svg.appendChild(dashedLayer);
  const solid = el("path", {
    d: solidSegs.map(([x1, y1, x2, y2]) => `M${x1} ${y1}L${x2} ${y2}`).join(""),
    fill: "none", stroke: "#d63384", "stroke-width": 0.08,
  });
  svg.appendChild(solid);

  // 4. 数字面板：像素数与耗时均来自引擎输出
  const match = rendered === s.filled;
  document.getElementById("stats").innerHTML =
    `画布 <b>${W}×${H}</b> · 规则 <b>${s.rule}</b> · ` +
    `填充像素 <b>${s.filled}</b>（引擎）/ <b class="${match ? "ok" : "bad"}">${rendered}</b>（页面） · ` +
    `耗时 <b>${s.elapsed_ms} ms</b>（引擎实测） · hash <b>${s.hash}</b>`;
}

const picker = document.getElementById("picker");
for (const name of Object.keys(SAMPLES)) {
  const opt = document.createElement("option");
  opt.value = opt.textContent = name;
  picker.appendChild(opt);
}
const requested = new URLSearchParams(location.search).get("sample");
const initial = SAMPLES[requested] ? requested : "01-concave";
picker.value = initial;
picker.addEventListener("change", () => {
  const q = new URLSearchParams(location.search);
  q.set("sample", picker.value);
  location.search = q.toString();
});
render(initial);
</script>
</body>
</html>
